[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-api"
version = "1.0.0"
description = "Lab 1 - Product API CRUD (Flask, SQLAlchemy 2.x, marshmallow)"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0,<4",
    "Flask-SQLAlchemy>=3.1,<4",
    "Flask-Migrate>=4.0,<5",
    "SQLAlchemy>=2.0,<3",
    "marshmallow>=3.20,<4",
    "gunicorn>=22",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6", "openapi-spec-validator>=0.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
