extends: ["spectral:oas"]
 
rules:
  info-contact: off
  operation-description: off
  operation-tags: off
 
  no-body-on-204:
    description: Response HTTP 204 không được khai báo content.
    severity: error
    given: "$.paths[*][*].responses['204']"
    then:
      field: content
      function: falsy
 
  book-year-must-be-integer:
    description: Book.year phải khai báo type integer, khớp với model Python.
    severity: error
    given: "$.components.schemas.Book.properties.year"
    then:
      field: type
      function: enumeration
      functionOptions:
        values: [integer]
 
  response-200-schema-has-fields:
    description: Response 200 phải có schema với ít nhất 1 trường.
    message: Response 200 phải có schema với ít nhất 1 trường (properties, hoặc items.properties nếu là mảng).
    severity: error
    given: "$.paths[*][*].responses['200'].content[*]"
    then:
      - field: schema
        function: truthy
      - field: schema
        function: schema
        functionOptions:
          schema:
            type: object
            anyOf:
              - required: [properties]
                properties:
                  properties: {type: object, minProperties: 1}
              - required: [items]
                properties:
                  items:
                    type: object
                    required: [properties]
                    properties:
                      properties: {type: object, minProperties: 1}
 